# The RPC gateway of Workspace's recipe A (docs/widget-plugins/SERVER-SIDE.md 5.3): the only
# service that joins both the Workspace network and the backend's. It takes the API's calls
# on 8081 and passes the plugin-backend paths to the backend; the backend has no way back.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # The API sends call bodies of up to 96 KiB
  client_max_body_size 128k;

  server {
    listen 8081;

    location /.workspace/ {
      proxy_pass http://sql-explorer-backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_read_timeout 35s;
    }

    location / {
      return 404;
    }
  }
}
