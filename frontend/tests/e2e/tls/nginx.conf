# The end-to-end stack over HTTPS, as a deployment serves it (docker-compose.e2e.yml): the
# web app, the API and Ines on their usual ports, with the certificate for localhost that
# tests/e2e/make-tls.sh made in tests/e2e/tls/certs. The session cookie is Secure, and WebKit
# does not count http://localhost as secure, so over plain HTTP it would never send it.
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;

  # Uploads, streamed answers and websockets go through as they are
  client_max_body_size 0;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  server {
    listen 3000 ssl;
    location / {
      proxy_pass http://web:8080;
    }
  }

  server {
    listen 8000 ssl;
    location / {
      proxy_pass http://api:8000;
    }
  }

  server {
    listen 7777 ssl;
    location / {
      proxy_pass http://ines:7777;
    }
  }
}
