# The whole app on one machine. Run `make up` in this folder; LOCAL_SETUP.md
# explains each part.
name: openbb

# Shared by the three backend services: same code, same settings.
x-backend: &backend
  build:
    context: ../backend-api/backend
    dockerfile: fastapi.Dockerfile
  # The backend Dockerfiles build for linux/amd64. Apple Silicon Macs run them
  # under emulation.
  platform: linux/amd64
  env_file: backend.env
  volumes:
    # The source is mounted, so edits reach the containers without a rebuild.
    - ../backend-api/backend:/opt/code

services:
  mysql:
    image: mysql:8.0
    command:
      ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: user_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs to completion before the backend starts: applies the migrations, then
  # creates the entity and admin user from backend/scripts/cfgs/config.toml and
  # writes user_create.json, which the backend reads at start. Safe to re-run;
  # it keeps what exists. A stale user_create.json from an older database
  # breaks admin login, so it is removed first.
  init:
    <<: *backend
    command:
      [
        "sh",
        "-c",
        "rm -f user_create.json && python -m alembic upgrade head && python -m scripts.init_users",
      ]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    <<: *backend
    # Restarts itself when a file under backend-api/backend changes.
    command:
      [
        "python", "-m", "uvicorn", "main:app",
        "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-dir", "/opt/code",
      ]
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  # Runs background jobs. Does not reload by itself: after changing worker
  # code, run `make restart s=backend-worker`.
  backend-worker:
    <<: *backend
    build:
      context: ../backend-api/backend
      dockerfile: rqworker.Dockerfile
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    # Same Node and Bun versions as frontend/Dockerfile. node-gyp is installed
    # up front because some packages (bufferutil) have no prebuilt binary for
    # Linux on ARM and compile during `bun install` on Apple Silicon.
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm install --global --silent bun@1.4.2 node-gyp && bun install --frozen-lockfile && exec bun run dev",
      ]
    # These take priority over the values in frontend/.env. The browser calls the
    # URLs, so they are host addresses.
    environment:
      VITE_PAYMENTS_URL: http://localhost:8000
      VITE_PLATFORM_URL: http://localhost:7777
      VITE_AI_API_URL: http://localhost:7778
      # Shows the sign-up screen. Locally the account email lands in the backend
      # log; `make emails` prints it.
      VITE_AUTHENTICATION_ALLOW_REGISTRATION: "true"
    ports:
      - "1420:1420"
    volumes:
      - ../frontend:/app
      # Linux packages for the container, kept apart from any node_modules on the host.
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:1420"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

volumes:
  mysql-data:
  frontend-node-modules:
