name: workspace-local

x-backend: &backend
  build:
    context: ../backend-api/backend
    dockerfile: fastapi.Dockerfile
  platform: ${PLATFORM:-linux/amd64}
  env_file: ../backend-api/backend/envs/.env
  environment:
    MODE: local
    DB_HOST: mysql
    REDIS_HOST: valkey
    FOLDER_STORAGE_PATH: /opt/code/local_storage
    FRONTENDURL: http://localhost:1420
    APPURL: http://localhost:1420
  volumes:
    - ../backend-api/backend:/opt/code

services:
  mysql:
    image: mysql:8.0
    command:
      ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workspace
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mysql-data:/var/lib/mysql

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  init:
    <<: *backend
    command:
      - python
      - -c
      - |
        import pathlib, subprocess, sys
        pathlib.Path("user_create.json").write_text("{}")
        subprocess.run([sys.executable, "-m", "alembic", "upgrade", "head"], check=True)
        subprocess.run([sys.executable, "-m", "scripts.init_users"], check=True)
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy

  backend:
    <<: *backend
    command:
      [
        "python", "-m", "uvicorn", "main:app",
        "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-dir", "/opt/code",
      ]
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  backend-worker:
    <<: *backend
    command: ["python", "base_workers.py"]
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "npm install --ignore-scripts --no-audit --no-fund && exec npm run dev",
      ]
    environment:
      VITE_BACKEND_URL: http://localhost:8000
      VITE_AI_API_URL: ""
    ports:
      - "1420:1420"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:1420"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 30s

volumes:
  mysql-data:
  frontend-node-modules:
