[build]
  base = "website"
  command = "npm run build"
  publish = "build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../docs ../netlify.toml ../frontend/src ../frontend/app-config.js ../frontend/apps-schema.json ../frontend/nginx.conf ../frontend/tests/fixtures ../agent/src ../agent/mcp-server/src ../agent/scripts/reference ../agent/tests/fixtures ../agent/.env.example ../backend-api/backend/tests/fixtures ../backend-api/backend/envs/.env.example"

[build.environment]
  NODE_VERSION = "26.12.1"
