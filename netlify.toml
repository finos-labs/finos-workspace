[build]
  base = "website"
  command = "pip install poetry==2.3.2 && (cd ../backend-api/backend && poetry config virtualenvs.create false && poetry install --only main) && npm run reference && npm run build"
  publish = "build"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ../docs ../netlify.toml ../frontend ../agent ../backend-api/backend"

[build.environment]
  NODE_VERSION = "26.12.1"
  PYTHON_VERSION = "3.13"
