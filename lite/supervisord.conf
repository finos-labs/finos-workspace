[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:redis]
command=/usr/bin/redis-server --dir /data/redis --save 60 1 --loglevel warning --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=10
user=appuser
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/opt/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 --workers %(ENV_WORKERS)s
directory=/opt/code
autostart=true
autorestart=true
priority=20
user=appuser
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Plugin backends (docs/widget-plugins/SERVER-SIDE.md 5.4, recipe B): started by the entrypoint
; only when /etc/workspace/plugin-runner.toml is there. It runs as root to put each backend in
; a sandbox of its own, and needs the container's seccomp profile (lite/README.md).
[program:plugin-runner]
command=/opt/.venv/bin/python -m plugin_runner /etc/workspace/plugin-runner.toml
directory=/opt/plugin-runner
autostart=%(ENV_PLUGIN_RUNNER)s
autorestart=true
priority=25
user=root
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
