name: Build & publish OpenBB Lite image

# Builds the single-image OpenBB Lite distribution. The backend (backend-api/
# backend) and the frontend (frontend/) both come from this repository. Both
# default to `develop` but can be pointed at any branch, tag, SHA, or PR (use
# refs/pull/<N>/head) per run.
#
# GitHub only runs workflows from the root .github/workflows/, so this file is
# inactive while it lives under lite/. The paths below assume it runs from the
# repository root. The image is pushed to GHCR using the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Ref for backend-api/backend (branch, tag, SHA, or refs/pull/<N>/head)"
        default: develop
      frontend_ref:
        description: "Ref for frontend/ (branch, tag, SHA, or refs/pull/<N>/head)"
        default: develop
      push_image:
        description: "Push the image to GHCR (uncheck to build only)"
        type: boolean
        default: true
      tag:
        description: "Extra image tag (in addition to the VERSION file and git sha)"
        default: ""
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: openbb-finance/lite
  # Defaults used by the `push` trigger (workflow_dispatch overrides via inputs).
  DEFAULT_REF: develop

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lite (Dockerfile + container config)
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.frontend_ref || env.DEFAULT_REF }}
          sparse-checkout: frontend
          path: _frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.backend_ref || env.DEFAULT_REF }}
          sparse-checkout: backend-api/backend
          path: _backend

      - name: Assemble build context
        run: |
          rm -rf lite/backend lite/frontend
          mv _frontend/frontend lite/frontend
          mv _backend/backend-api/backend lite/backend
          rm -rf _frontend _backend
          echo "Backend ref:     ${{ github.event.inputs.backend_ref || env.DEFAULT_REF }}"
          echo "Frontend ref:    ${{ github.event.inputs.frontend_ref || env.DEFAULT_REF }}"

      - name: Resolve image tags
        id: meta
        run: |
          version="$(tr -d '[:space:]' < lite/VERSION)"
          sha="${GITHUB_SHA::12}"
          tags="${REGISTRY}/${IMAGE}:${version},${REGISTRY}/${IMAGE}:${sha},${REGISTRY}/${IMAGE}:latest"
          extra="${{ github.event.inputs.tag }}"
          if [ -n "$extra" ]; then tags="${tags},${REGISTRY}/${IMAGE}:${extra}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image tags: $tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_image != 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: lite
          file: lite/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
