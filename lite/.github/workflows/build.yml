name: Build & publish the Docker image

# Builds the single-image distribution from this repository: the
# backend from backend-api/backend and the frontend from frontend/, assembled
# next to lite/Dockerfile. Runs from the repository root. The image is pushed to
# GHCR as <owner>/lite unless the LITE_IMAGE repository variable names another
# image (`namespace/name`), using the built-in GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the image to GHCR (uncheck to build only)"
        type: boolean
        default: true
      tag:
        description: "Extra image tag (in addition to the VERSION file and git sha)"
        default: ""
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble build context
        run: |
          rm -rf lite/backend lite/frontend
          cp -R backend-api/backend lite/backend
          cp -R frontend lite/frontend

      - name: Resolve image tags
        id: meta
        env:
          LITE_IMAGE: ${{ vars.LITE_IMAGE }}
        run: |
          image="${LITE_IMAGE:-${GITHUB_REPOSITORY_OWNER,,}/lite}"
          version="$(tr -d '[:space:]' < lite/VERSION)"
          sha="${GITHUB_SHA::12}"
          tags="${REGISTRY}/${image}:${version},${REGISTRY}/${image}:${sha},${REGISTRY}/${image}:latest"
          extra="${{ github.event.inputs.tag }}"
          if [ -n "$extra" ]; then tags="${tags},${REGISTRY}/${image}:${extra}"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Image tags: $tags"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event.inputs.push_image != 'false' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: lite
          file: lite/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_image != 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
