name: sql-explorer

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  sql-explorer-backend:
    <<: *hardened
    build:
      context: ../dist/sql-explorer/${VERSION:?set VERSION to the package version}
      dockerfile: backend/Dockerfile
    image: sql-explorer-backend:${VERSION}
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - ./data:/data:ro
    networks: [plugin-rpc, plugin-db]

  sql-explorer-gateway:
    <<: *hardened
    image: nginx:1.31.6-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 64m
    pids_limit: 32
    volumes:
      - ./gateway.conf:/etc/nginx/nginx.conf:ro
    networks: [workspace, plugin-rpc]

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: explorer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, explorer_password]
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql
    networks: [plugin-db]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  explorer_password:
    file: ./secrets/explorer_password

volumes:
  postgres-data:

networks:
  plugin-rpc:
    internal: true
  plugin-db:
    internal: true
  workspace:
    external: true
    name: ${WORKSPACE_NETWORK:?set WORKSPACE_NETWORK to the Workspace stack's network}
