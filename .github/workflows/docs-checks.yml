name: Docs checks

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "netlify.toml"
      - "backend-api/backend/tests/fixtures/**"
      - "backend-api/backend/envs/.env.example"
      - "frontend/src/**"
      - "frontend/app-config.js"
      - "frontend/apps-schema.json"
      - "frontend/nginx.conf"
      - "frontend/tests/fixtures/**"
      - "agent/src/**"
      - "agent/mcp-server/src/**"
      - "agent/scripts/reference/**"
      - "agent/tests/fixtures/**"
      - "agent/.env.example"
      - ".github/workflows/docs-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  node:
    uses: ./.github/workflows/agent-node.yml

  build:
    name: Generate, types and build
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts --os=linux --cpu=x64 --libc=musl
        working-directory: website
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate the reference data, which fails when a page is out of step with the code
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/website "$NODE_IMAGE" /usr/local/bin/node \
            --disable-warning=ExperimentalWarning scripts/generate.mts
      - name: Check the types
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/website --entrypoint /repo/website/node_modules/@typescript/typescript-linux-x64/lib/tsc \
            "$NODE_IMAGE" --noEmit
      - name: Build the site, which fails on a broken link or anchor
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/website "$NODE_IMAGE" /usr/local/bin/node \
            node_modules/@docusaurus/core/bin/docusaurus.mjs build
      - name: Check that the build wrote llms.txt
        run: test -s website/build/llms.txt
