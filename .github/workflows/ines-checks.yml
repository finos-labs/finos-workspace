name: Ines checks

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/ines-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - run: npm ci
      - run: npm run typecheck

  tests:
    name: Tests
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - run: npm ci
        working-directory: agent
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the tests on the images' Node
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm -v "$PWD/agent:/app" -w /app "$NODE_IMAGE" /usr/local/bin/node --test \
            --experimental-test-module-mocks --import ./tests/setup.ts 'tests/**/*.test.ts' 'mcp-server/test/**/*.test.ts'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.12.1
      - run: npm audit --omit=dev --audit-level=critical

  node:
    uses: ./.github/workflows/agent-node.yml

  image:
    name: Images build
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the agent and the MCP server images
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker build --build-context "node=docker-image://$NODE_IMAGE" --target ines -t ines:check agent
          docker build --build-context "node=docker-image://$NODE_IMAGE" --target ines-mcp -t ines-mcp:check agent
