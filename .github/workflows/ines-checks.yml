name: Ines checks

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/ines-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

# Ines is the built-in agent: the agent (agent/src) and the MCP server it uses for its tools (agent/mcp-server).
# The tests need no keys and no network. The evals (agent/evals) call a real model and are run by hand.
jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci
      - run: npm run typecheck

  # The tests run on the Node the images run on (the finos-node release that agent-node.yml names), in a
  # container of it, with the packages npm installed here.
  tests:
    name: Tests
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm ci
        working-directory: agent
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the tests on the images' Node
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm -v "$PWD/agent:/app" -w /app "$NODE_IMAGE" /usr/local/bin/node --test \
            --experimental-test-module-mocks --import ./tests/setup.ts 'tests/**/*.test.ts' 'mcp-server/test/**/*.test.ts'

  # A critical advisory in what the agent ships fails the check. Lower ones are reviewed by hand: most are in
  # code that is not reached (sprintf-js under mammoth's command-line parser, for one).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - run: npm audit --omit=dev --audit-level=critical

  # Node for the images: the finos-node release (agent-node.yml).
  node:
    uses: ./.github/workflows/agent-node.yml

  image:
    name: Images build
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the agent and the MCP server images
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker build --build-context "node=docker-image://$NODE_IMAGE" --target ines -t ines:check agent
          docker build --build-context "node=docker-image://$NODE_IMAGE" --target ines-mcp -t ines-mcp:check agent
