name: Ines checks

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/ines-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Ines is the built-in agent: the agent (agent/src) and the MCP server it uses for its tools (agent/mcp-server).
# The tests need no keys and no network. The evals (agent/evals) call a real model and are run by hand.
jobs:
  typecheck:
    name: Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  # The tests run on Node, the agent's runtime (the version agent/Dockerfile builds); Bun installs the packages.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test

  # A critical advisory in what the agent ships fails the check. Lower ones are reviewed by hand: most are in
  # code that is not reached (sprintf-js under mammoth's command-line parser, for one).
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun audit --prod --audit-level=critical

  # Node for the images, built once and kept in the Actions cache (agent-node.yml).
  node:
    uses: ./.github/workflows/agent-node.yml

  image:
    name: Images build
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v6
        with:
          path: agent-node
          key: ${{ needs.node.outputs.key }}
          fail-on-cache-miss: true
      - name: Build the agent and the MCP server images
        run: |
          docker build --build-context node=agent-node --target ines -t ines:check agent
          docker build --build-context node=agent-node --target ines-mcp -t ines-mcp:check agent
