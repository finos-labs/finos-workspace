name: finos-node

# The Node the agent's images run on, released as ghcr.io/<owner>/finos-node:<Node version>-<build>.
# A tag finos-node-v<Node version>-<build> (finos-node-v26.12.1-1) builds the stage `node` of
# agent/Dockerfile once, pushes it as that image (a tag that exists is never replaced), attests its
# SBOM and build provenance, and publishes a GitHub release with the image's filesystem as a tarball,
# its SHA-256 and the SBOM. The jobs that build the agent's images take the release from there, pinned
# by digest (agent-node.yml), so none of them compiles Node; a local build compiles the stage itself.
#
# A new Node version is a change to agent/Dockerfile and build 1 of that version. A new build of the
# same Node (-2, -3, ...) is for a fix in what Chimera supplies (musl, libc++, OpenSSL, ICU, the time
# zones) or a change to the stage. finos-node-check.yml says every week whether one is due.
#
# The attestations, and the storage records that tie them to the image (artifact metadata), are
# written by the finos-node-bot GitHub App (secrets NODE_APP_ID and NODE_APP_PRIVATE_KEY);
# this workflow's own token pushes the image, signs (OIDC) and publishes the release.
on:
  push:
    tags:
      - "finos-node-v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release finos-node
    runs-on: ubuntu-latest
    # Node is compiled here, which takes hours on a hosted runner.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Read the release from the tag
        id: release
        run: |
          release="${GITHUB_REF_NAME#finos-node-v}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' <<< "$release"; then
            echo "The tag $GITHUB_REF_NAME must be finos-node-v<Node version>-<build>, like finos-node-v26.12.1-1" >&2
            exit 1
          fi
          if ! grep -qx "ARG NODE_VERSION=${release%-*}" agent/Dockerfile; then
            echo "agent/Dockerfile does not build Node ${release%-*}" >&2
            exit 1
          fi
          {
            echo "release=$release"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finos-node"
            echo "tarball=finos-node-$release-linux-amd64.tar.gz"
            echo "sbom=finos-node-$release.cdx.json"
          } >> "$GITHUB_OUTPUT"

      # The App writes the attestations hours from now, after the build: a release it could not attest
      # would keep its tag, so a missing variable or a key the App refuses stops the run here instead.
      - name: Check that the App gives a token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NODE_APP_ID }}
          private-key: ${{ secrets.NODE_APP_PRIVATE_KEY }}
          permission-attestations: write
          permission-artifact-metadata: write

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A rerun for a tag that was released stops here.
      - name: Check that the release is new
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
        run: |
          if docker manifest inspect "$IMAGE:$RELEASE" > /dev/null 2>&1; then
            echo "$IMAGE:$RELEASE is released already, and a release is not replaced" >&2
            exit 1
          fi

      - name: Build the stage
        run: docker build --target node --output type=local,dest=finos-node agent

      # The image is the stage's filesystem, and the tarball is the same files.
      - name: Push the image
        id: push
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          tar -C finos-node -czf "$TARBALL" .
          sha256sum "$TARBALL" > SHA256SUMS
          tar -C finos-node -c . | docker import \
            --change "ENV PATH=/usr/local/bin:/usr/bin:/bin" \
            --change "LABEL org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --change "LABEL org.opencontainers.image.version=$RELEASE" \
            - "$IMAGE:$RELEASE"
          docker push --quiet "$IMAGE:$RELEASE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$RELEASE")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/install-syft

      # Keep syft's serialNumber: actions/attest takes a CycloneDX file as an SBOM only with one.
      - name: SBOM of the image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
          SBOM: ${{ steps.release.outputs.sbom }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: none
        run: syft scan "docker:$IMAGE:$RELEASE" --quiet --select-catalogers +sbom-cataloger --output "cyclonedx-json=$SBOM"

      # Asked for after the build: an App's token lasts an hour, and compiling Node takes longer.
      - name: Get the App's token for the attestations
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.NODE_APP_ID }}
          private-key: ${{ secrets.NODE_APP_PRIVATE_KEY }}
          permission-attestations: write
          permission-artifact-metadata: write

      - uses: actions/attest@v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.release.outputs.sbom }}
          push-to-registry: true
          github-token: ${{ steps.token.outputs.token }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          github-token: ${{ steps.token.outputs.token }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.release.outputs.tarball }}
          github-token: ${{ steps.token.outputs.token }}

      # The notes say what the image is for and what it holds, with the versions from the SBOM it carries.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.release.outputs.image }}
          RELEASE: ${{ steps.release.outputs.release }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TARBALL: ${{ steps.release.outputs.tarball }}
          SBOM: ${{ steps.release.outputs.sbom }}
        run: |
          python3 - finos-node/usr/share/sbom/runtime.cdx.json > notes.md <<'EOF'
          import json, os, sys
          components = json.load(open(sys.argv[1]))["components"]
          version = {c["name"]: c.get("version") for c in components}
          licence = lambda c: " AND ".join(l["expression"] for l in c["licenses"])
          compiled = [c for c in components
                      if any(p["name"] == "compiled-into" and p["value"].startswith("node ") for p in c.get("properties", []))]
          image, release, digest = os.environ["IMAGE"], os.environ["RELEASE"], os.environ["DIGEST"]
          node, build = release.rsplit("-", 1)
          tarball, sbom, owner = os.environ["TARBALL"], os.environ["SBOM"], os.environ["GITHUB_REPOSITORY_OWNER"]
          rows = "\n".join(f"| {c['name']} | {c.get('version') or '-'} | {licence(c)} |" for c in compiled)
          print(f"""**Node.js {node} that passes FINOS's licence review**, the runtime of the Workspace's agent (Ines) and its MCP server.

          Node's official images, and the distroless, hardened and Alpine ones, link GCC's C++ runtime (libstdc++ and libgcc_s), and most of them run on glibc: FINOS counts both as Category X, so none of them can ship. This is Node compiled from its source with clang, against musl and LLVM's libc++, in an image built `FROM scratch`. It holds Node, the libraries Node links and the time zones, each under a licence FINOS accepts (Category A or B). It has no shell, package manager, npm or compiler, and the build fails if a GCC runtime library gets in.

          ```
          {image}:{release}@{digest}
          ```

          ### What it is for

          `agent/Dockerfile` builds the `ines` and `ines-mcp` images on it: it installs the agent's npm packages with this Node (npm stays in the build) and adds the agent's code. CI takes this release in place of the Dockerfile's `node` stage, so no job compiles Node, which takes hours; a local build compiles the stage itself.

          ### What it holds

          | Component | Version | Licence |
          | --- | --- | --- |
          | Node.js | {version["node"]} | MIT |
          | V8 and {len(compiled) - 1} more libraries compiled into Node (below) | - | {", ".join(sorted({licence(c) for c in compiled}))} |
          | musl, with mimalloc | {version["musl"]} | MIT |
          | LLVM libc++, libc++abi and libunwind | {version["libcxx"]} | Apache-2.0 WITH LLVM-exception AND NCSA |
          | OpenSSL | {version["openssl3-libs"]} | Apache-2.0 |
          | ICU, with its data | {version["icu-libs"]} | ICU |
          | Time zones (tzdb) | {version["tzdb"]} | Public domain |

          <details><summary>Compiled into Node</summary>

          | Component | Version | Licence |
          | --- | --- | --- |
          {rows}

          </details>

          `{sbom}` is the SBOM of the whole image; the image carries this list in `/usr/share/sbom/runtime.cdx.json`.

          ### Hardening

          `node` is position-independent, has full RELRO (`BIND_NOW`), a stack that does not execute, the strong stack protector and stack clash protection. The build checks the binary for the first four and fails without them.

          ### Use

          ```dockerfile
          FROM scratch
          COPY --from={image}:{release}@{digest} / /
          ```

          Or in place of `agent/Dockerfile`'s `node` stage, as CI does:

          ```sh
          docker build --build-context node=docker-image://{image}:{release}@{digest} agent
          ```

          ### Verify

          ```sh
          gh attestation verify oci://{image}:{release} --owner {owner}
          gh attestation verify {tarball} --owner {owner}
          sha256sum -c SHA256SUMS
          ```

          ### Files

          - `{tarball}`: the image's filesystem, to build without the registry.
          - `SHA256SUMS`: its checksum.
          - `{sbom}`: the image's CycloneDX SBOM, also attested on the image with its build provenance.

          Built from `agent/Dockerfile` (stages `node-build` and `node`) at {os.environ["GITHUB_SHA"]}, for linux/amd64. This is build {build} of Node {node}. A later build of the same Node takes fixes in musl, libc++, OpenSSL, ICU or the time zones, which `finos-node-check.yml` looks for every week.""")
          EOF
          gh release create "$GITHUB_REF_NAME" "$TARBALL" SHA256SUMS "$SBOM" --title "finos-node $RELEASE" --notes-file notes.md
