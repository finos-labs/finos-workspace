name: End-to-end tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend-api/backend/**"
      - "ines/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright against the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # A stack of its own: random secrets, and an administrator whose password only this
      # run knows. The tests sign in as that administrator.
      - name: Configure the stack
        working-directory: backend-api/backend
        run: |
          EMAIL="e2e-admin@example.com"
          python3 -m scripts.create_local_env --admin-email "$EMAIL" --entity-name "End-to-end"
          PASSWORD="$(python3 -c "import tomllib; print(tomllib.load(open('scripts/cfgs/config.toml', 'rb'))['admins'][0]['password'])")"
          echo "::add-mask::$PASSWORD"
          echo "E2E_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "E2E_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      # The widget plugin tests write their packages into a directory the API reads. The
      # proxy test's upstream runs on the runner with a certificate signed by a CA made
      # for this run; the API trusts that CA and reaches the upstream by its name.
      - name: Mount a widget plugins directory
        run: |
          mkdir -p "$RUNNER_TEMP/widget-plugins"
          frontend/tests/e2e/plugins/make-proxy-tls.sh "$RUNNER_TEMP/proxy-tls" proxy-upstream.e2e.test
          cat > "$RUNNER_TEMP/compose.plugins.yml" <<EOF
          services:
            api:
              environment:
                WIDGET_PLUGINS_DIR: /opt/widget-plugins
                WIDGET_PLUGIN_PROXY_CA_FILE: /opt/widget-plugin-ca/ca.pem
                WIDGET_PLUGIN_BACKENDS: '{"e2e-forecast": "http://plugin-backend.e2e.test:7794"}'
              volumes:
                - $RUNNER_TEMP/widget-plugins:/opt/widget-plugins:ro
                - $RUNNER_TEMP/proxy-tls/ca.pem:/opt/widget-plugin-ca/ca.pem:ro
              extra_hosts:
                - "proxy-upstream.e2e.test:host-gateway"
                - "plugin-backend.e2e.test:host-gateway"
          EOF
          echo "E2E_PLUGINS_DIR=$RUNNER_TEMP/widget-plugins" >> "$GITHUB_ENV"
          echo "E2E_PROXY_TLS_DIR=$RUNNER_TEMP/proxy-tls" >> "$GITHUB_ENV"
          echo "E2E_BACKENDS=1" >> "$GITHUB_ENV"
          # The API container reaches the runner through the Docker bridge, not loopback
          echo "E2E_PROXY_LISTEN=0.0.0.0" >> "$GITHUB_ENV"
          echo "E2E_BACKEND_LISTEN=0.0.0.0" >> "$GITHUB_ENV"

      # docker-compose.e2e.yml adds the stubbed model and points Ines at it, so the tests can ask
      # the Copilot a question without a provider key (a pull request from a fork gets no secrets).
      - name: Build and start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" up -d --build

      # Ines is in this stack and no test here asks her a question, so without this a run where she
      # never started would still be green. /status is hers; the MCP server publishes no port, so the
      # closest check on it is that her container is up, which compose's health check already is.
      - name: Wait for the stack
        run: |
          for url in http://localhost:8000/health http://localhost:3000/ http://localhost:3001/ http://localhost:7777/status; do
            for _ in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              sleep 5
            done
            curl -fsS -o /dev/null "$url"
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium firefox webkit

      # Every spec in Chromium; the widget plugin specs in Firefox and WebKit as well, since a
      # plugin's frame, policy and workers are where the engines differ (playwright.config.ts)
      - name: Playwright tests
        working-directory: frontend
        run: bunx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" down -v
