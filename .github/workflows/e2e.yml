name: End-to-end tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend-api/backend/**"
      - "agent/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  # Node for the agent's images: the finos-node release (agent-node.yml).
  node:
    uses: ./.github/workflows/agent-node.yml

  playwright:
    name: Playwright against the compose stack
    needs: node
    runs-on: ubuntu-latest
    # A run that finds the backend's stages missing from the Actions cache compiles its dependencies.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A stack of its own: random secrets, and an administrator whose password only this
      # run knows. The tests sign in as that administrator.
      - name: Configure the stack
        working-directory: backend-api/backend
        run: |
          EMAIL="e2e-admin@example.com"
          python3 -m scripts.create_local_env --admin-email "$EMAIL" --entity-name "End-to-end"
          echo "E2E_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"

      # docker-compose.e2e.yml adds the stubbed model and points Ines at it, so the tests can ask
      # the Copilot a question without a provider key (a pull request from a fork gets no secrets).
      # The backend's images compile their dependencies from source: they are built with their stages
      # kept in the Actions cache (the scopes the image workflows use). The agent's images take Node from
      # the finos-node release the node job names. Then the stack is started.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the stack's images
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: >-
          docker buildx bake -f docker-compose.yml -f docker-compose.e2e.yml --load
          --set init.cache-from=type=gha,scope=fastapi.Dockerfile
          --set init.cache-to=type=gha,mode=max,scope=fastapi.Dockerfile
          --set worker.cache-from=type=gha,scope=rqworker.Dockerfile
          --set worker.cache-to=type=gha,mode=max,scope=rqworker.Dockerfile
          --set "ines.contexts.node=docker-image://$NODE_IMAGE"
          --set "ines-mcp.contexts.node=docker-image://$NODE_IMAGE"

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d

      # Ines is in this stack and no test here asks her a question, so without this a run where she
      # never started would still be green. /status is hers; the MCP server publishes no port, so the
      # closest check on it is that her container is up, which compose's health check already is.
      - name: Wait for the stack
        run: |
          for url in http://localhost:8000/health http://localhost:3000/ http://localhost:7777/status; do
            for _ in $(seq 1 60); do
              curl -fsS -o /dev/null "$url" && break
              sleep 5
            done
            curl -fsS -o /dev/null "$url"
          done

      # The administrator has no password until one is set, as an operator sets it: read
      # from standard input, never printed
      - name: Set the administrator's password
        run: |
          PASSWORD="$(python3 -c 'import secrets; print("E2e-" + secrets.token_urlsafe(24) + "!1a")')"
          echo "::add-mask::$PASSWORD"
          printf '%s\n' "$PASSWORD" | docker compose run --rm -T init python -m scripts.init_users --new-password "$E2E_USER_EMAIL"
          echo "E2E_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
