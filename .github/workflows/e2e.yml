name: End-to-end tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend-api/backend/**"
      - "agent/**"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - ".github/workflows/e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  node:
    uses: ./.github/workflows/agent-node.yml

  playwright:
    name: Playwright against the compose stack
    needs: node
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure the stack
        working-directory: backend-api/backend
        run: |
          EMAIL="e2e-admin@example.com"
          python3 -m scripts.create_local_env --admin-email "$EMAIL" --entity-name "End-to-end"
          echo "E2E_USER_EMAIL=$EMAIL" >> "$GITHUB_ENV"

      - name: Mount a widget plugins directory
        run: |
          mkdir -p "$RUNNER_TEMP/widget-plugins"
          frontend/tests/e2e/make-tls.sh "$RUNNER_TEMP/proxy-tls" proxy-upstream.e2e.test
          cat > "$RUNNER_TEMP/compose.plugins.yml" <<EOF
          services:
            api:
              environment:
                WIDGET_PLUGINS_DIR: /opt/widget-plugins
                WIDGET_PLUGIN_PROXY_CA_FILE: /opt/widget-plugin-ca/ca.pem
                WIDGET_PLUGIN_BACKENDS: '{"e2e-forecast": "http://plugin-backend.e2e.test:7794"}'
              volumes:
                - $RUNNER_TEMP/widget-plugins:/opt/widget-plugins:ro
                - $RUNNER_TEMP/proxy-tls/ca.pem:/opt/widget-plugin-ca/ca.pem:ro
              extra_hosts:
                - "proxy-upstream.e2e.test:host-gateway"
                - "plugin-backend.e2e.test:host-gateway"
          EOF
          {
            echo "E2E_PLUGINS_DIR=$RUNNER_TEMP/widget-plugins"
            echo "E2E_PROXY_TLS_DIR=$RUNNER_TEMP/proxy-tls"
            echo "E2E_BACKENDS=1"
            echo "E2E_PROXY_LISTEN=0.0.0.0"
            echo "E2E_BACKEND_LISTEN=0.0.0.0"
          } >> "$GITHUB_ENV"

      - name: Make the stack's certificate
        run: |
          frontend/tests/e2e/make-tls.sh frontend/tests/e2e/tls/certs localhost "*.sandbox.localhost"
          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/frontend/tests/e2e/tls/certs/ca.pem" >> "$GITHUB_ENV"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build the stack's images
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: >-
          docker buildx bake -f docker-compose.yml -f docker-compose.e2e.yml --load
          --set init.cache-from=type=gha,scope=fastapi.Dockerfile
          --set init.cache-to=type=gha,mode=max,scope=fastapi.Dockerfile
          --set "web.contexts.node=docker-image://$NODE_IMAGE"
          --set "agent.contexts.node=docker-image://$NODE_IMAGE"
          --set "agent-mcp.contexts.node=docker-image://$NODE_IMAGE"

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" up -d

      - name: Wait for the stack
        run: |
          for url in https://localhost:8000/health https://localhost:3000/ https://localhost:7777/status; do
            for _ in $(seq 1 60); do
              curl -fsS --cacert "$NODE_EXTRA_CA_CERTS" -o /dev/null "$url" && break
              sleep 5
            done
            curl -fsS --cacert "$NODE_EXTRA_CA_CERTS" -o /dev/null "$url"
          done

      - name: Set the administrator's password
        run: |
          PASSWORD="$(python3 -c 'import secrets; print("E2e-" + secrets.token_urlsafe(24) + "!1a")')"
          echo "::add-mask::$PASSWORD"
          printf '%s\n' "$PASSWORD" | docker compose run --rm -T init python -m scripts.init_users --new-password "$E2E_USER_EMAIL"
          echo "E2E_USER_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1

      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit

      - name: Playwright tests
        working-directory: frontend
        run: npx playwright test --project=chromium --project=firefox --project=webkit

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Show the stack's logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml -f "$RUNNER_TEMP/compose.plugins.yml" down -v
