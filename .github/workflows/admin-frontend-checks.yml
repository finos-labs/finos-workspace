name: Admin panel checks

on:
  pull_request:
    paths:
      - "backend-api/admin_frontend/**"
      - ".github/workflows/admin-frontend-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Biome, types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api/admin_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
