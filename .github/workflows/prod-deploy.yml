name: Production Deployment of the Workspace (AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm deployment to production"
        required: true
        default: 'Type "deploy" to confirm deployment'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: frontend
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
    steps:
      - name: Confirm Deployment/Branch
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation required to deploy to production"
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "Only the main branch can be deployed to production"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup .env file
        run: |
          if [ -f .env ]; then
            echo "Editing .env file..."
            sed -i 's|^VITE_BACKEND_URL=.*|VITE_BACKEND_URL=${{ secrets.PROD_VITE_BACKEND_URL }}|' .env
            sed -i 's|^VITE_AI_API_URL=.*|VITE_AI_API_URL=${{ secrets.PROD_VITE_AI_API_URL }}|' .env
            sed -i 's|^VITE_GOOGLE_OAUTH_CLIENT_ID=.*|VITE_GOOGLE_OAUTH_CLIENT_ID=${{ secrets.PROD_VITE_GOOGLE_OAUTH_CLIENT_ID }}|' .env
          else
            echo ".env file not found, skipping edit."
          fi

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Deploy to S3 & Invalidate CloudFront
        uses: staevs/s3-deploy-action@ba007d3fd18709a01dbadd56ade8ffbd3beee150
        with:
          args: --follow-symlinks --delete --no-progress
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.PROD_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.PROD_CLOUDFRONT_DISTRIBUTION_ID }}
          S3_SOURCE_DIR: "frontend/dist"
          CLOUDFRONT_PATHS: "/*"

      - name: Set Cache Control for HTML files
        run: aws s3 cp s3://${{ secrets.PROD_S3_BUCKET }}/ s3://${{ secrets.PROD_S3_BUCKET }}/ --recursive --exclude "*" --include "*.html" --metadata-directive REPLACE --cache-control "no-cache, stale-if-error=0" --content-type text/html
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PROD_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}
