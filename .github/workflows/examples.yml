name: Example plugins

on:
  pull_request:
    paths:
      - "docs/examples/**"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reference-backend:
    name: Reference backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/reference-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --require-hashes -r python/requirements.txt
      - run: node --test test/parity.test.mjs
        env:
          PYTHON: python/.venv/bin/python

  reference-agent:
    name: Reference agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/reference-agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: |
          python -m venv python/.venv
          python/.venv/bin/pip install --require-hashes -r python/requirements.txt
      - run: node --test test/parity.test.mjs
        env:
          PYTHON: python/.venv/bin/python

  plotly-charts:
    name: Plotly charts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/examples/plotly-charts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  ag-grid:
    name: AgGrid
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Install the SQL explorer, whose editor and backend AgGrid reuses
        working-directory: docs/examples/sql-explorer
        run: npm ci --ignore-scripts
      - name: Build AgGrid
        working-directory: docs/examples/ag-grid
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Start a Postgres to test against
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name ag-grid-test-postgres -p 127.0.0.1:55433:5432 -e POSTGRES_PASSWORD="$password" postgres:18.6
          echo "postgresql://postgres:$password@127.0.0.1:55433/postgres" > "$RUNNER_TEMP/postgres_url"
          echo "SQL_EXPLORER_TEST_POSTGRES_FILE=$RUNNER_TEMP/postgres_url" >> "$GITHUB_ENV"
          until docker exec ag-grid-test-postgres pg_isready -q -h 127.0.0.1 -U postgres; do sleep 1; done
      - name: Test AgGrid
        working-directory: docs/examples/ag-grid
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r ../backend/requirements-test.txt
          npm test

  sql-explorer:
    name: SQL explorer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/examples/sql-explorer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r ../backend/requirements-test.txt
      - name: Start a Postgres to test against
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          docker run -d --name explorer-test-postgres -p 127.0.0.1:55432:5432 -e POSTGRES_PASSWORD="$password" postgres:18.6
          echo "postgresql://postgres:$password@127.0.0.1:55432/postgres" > "$RUNNER_TEMP/postgres_url"
          echo "SQL_EXPLORER_TEST_POSTGRES_FILE=$RUNNER_TEMP/postgres_url" >> "$GITHUB_ENV"
          until docker exec explorer-test-postgres pg_isready -q -h 127.0.0.1 -U postgres; do sleep 1; done
      - run: npm test

  backend:
    name: Examples backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.12.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Build the SQL explorer and AgGrid packages the image carries
        run: |
          (cd docs/examples/sql-explorer && npm ci --ignore-scripts && npm run build)
          (cd docs/examples/ag-grid && npm ci --ignore-scripts && npm run build)
      - name: Test the backend and its container
        working-directory: docs/examples/backend
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-test.txt
          .venv/bin/python -m pytest -q tests
