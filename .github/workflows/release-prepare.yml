name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, like 0.2.0 or 0.2.0-alpha.1.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Open the release pull request
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Get a token to push the release branch and open its pull request
        id: token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.SBOM_APP_ID }}
          private-key: ${{ secrets.SBOM_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - name: Cut the release branch and open its pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<< "$VERSION"; then
            echo "::error::The version must be X.Y.Z or X.Y.Z-prerelease, like 0.2.0 or 0.2.0-alpha.1, and it is '$VERSION'" >&2
            exit 1
          fi
          tag="v$VERSION"
          branch="release/$VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::$tag is released already" >&2
            exit 1
          fi
          if [ -n "$(git ls-remote --heads origin "$branch")" ]; then
            echo "::error::$branch exists already. Close its pull request and delete the branch to start again" >&2
            exit 1
          fi

          top_version() { awk '$1 == "##" && $2 == "Version" { print $3; exit }'; }

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch --no-track -C "$branch" origin/main
          git merge --no-commit --no-ff origin/develop || true
          git read-tree -u --reset origin/develop
          git clean -fdq

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main || true)
          if [ "$(git show origin/develop:frontend/CHANGELOG.md | top_version)" = "$VERSION" ]; then
            changes=$(awk '/^## /{ n++; next } n == 1' frontend/CHANGELOG.md)
          else
            args=(-f "tag_name=$tag" -f target_commitish=develop)
            [ -z "$previous" ] || args+=(-f "previous_tag_name=$previous")
            changes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body \
              | { grep -vE ' by @[^ ]+\[bot\] in ' || true; } \
              | sed -nE 's|^\* (.+) by @[^ ]+ in (https://[^ ]+/pull/([0-9]+))$|- \1 ([#\3](\2))|p')
            if [ -z "$changes" ]; then
              echo "::error::No pull request was merged into develop since ${previous:-the start}, so there is nothing to release" >&2
              exit 1
            fi
            day=$(date -u +%-d)
            case $day in
              1 | 21 | 31) ordinal=st ;;
              2 | 22) ordinal=nd ;;
              3 | 23) ordinal=rd ;;
              *) ordinal=th ;;
            esac
            {
              printf '## Version %s - %s %s%s, %s\n\n### Changes\n\n%s\n\n' "$VERSION" "$(date -u +%B)" "$day" "$ordinal" "$(date -u +%Y)" "$changes"
              git show origin/main:frontend/CHANGELOG.md
            } > frontend/CHANGELOG.md
          fi

          git add --all
          others=$(git diff --cached --name-only origin/develop -- . ':!frontend/CHANGELOG.md')
          if [ -n "$others" ]; then
            echo "::error::The release branch differs from develop in $others" >&2
            exit 1
          fi
          git commit --signoff --message "Release/$VERSION"
          git push origin "HEAD:refs/heads/$branch"

          # shellcheck disable=SC2016
          body=$(printf 'Release %s.\n\nThe Release workflow builds every image on this pull request, and all of it must pass before the pull request can be merged. Merging publishes the Docker images, tags the merge commit `%s` and creates the GitHub release with the changelog below.\n\nEdit `frontend/CHANGELOG.md` on this branch to change the notes.\n\n%s\n' "$VERSION" "$tag" "$changes")
          url=$(gh pr create --base main --head "$branch" --title "Release/$VERSION" --body "$body")
          echo "Release pull request: $url" >> "$GITHUB_STEP_SUMMARY"
