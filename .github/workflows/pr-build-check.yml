name: PR Build Check (Frontend)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"

concurrency:
  group: pr-build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.12.1

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build
