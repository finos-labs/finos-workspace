name: SBOM

# Keeps a CycloneDX SBOM of every project in sbom/: one for each directory with a
# package.json or a pyproject.toml, named after it (frontend/ is
# sbom/frontend.cdx.json, backend-api/backend/ is sbom/backend-api/backend.cdx.json).
# A merge into develop that changes a package.json, a pyproject.toml or a lockfile
# has every SBOM generated again. develop only takes reviewed pull requests, so
# when the SBOMs changed they go to the feature/sbom-update branch and a pull
# request into develop. A later run brings that pull request up to date, or
# closes it when develop's SBOMs are current again. sbom/ is written only by this
# workflow: a project that is gone loses its SBOM.
#
# Syft reads the lockfiles. Dev dependencies are included, and licenses a
# lockfile does not record come from the npm registry and PyPI. The SBOMs carry
# no serial number or timestamp, so the same dependencies give the same files.
#
# The branch and the pull request are pushed and opened as the openbq-sbom-bot
# GitHub App (variable SBOM_APP_ID, secret SBOM_APP_PRIVATE_KEY), with a token
# limited to this repository. GITHUB_TOKEN may not open pull requests here, and a
# pull request it opens runs no workflows, so the SBOM pull request would get no
# checks.
on:
  push:
    branches:
      - develop
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/bun.lock"
      - "**/pyproject.toml"
      - "**/poetry.lock"

# Every run generates all the SBOMs from its commit, so a newer merge replaces a
# run that is still going.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# GITHUB_TOKEN only reads: the App's token does the writing.
permissions:
  contents: read

env:
  BRANCH: feature/sbom-update

jobs:
  sbom:
    name: Generate the SBOMs
    runs-on: ubuntu-latest
    steps:
      - name: Get a token to push the SBOMs and open their pull request
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SBOM_APP_ID }}
          private-key: ${{ secrets.SBOM_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The checkout keeps the App's token, so the git push below uses it.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: ./.github/actions/install-syft

      - name: Generate the SBOMs
        shell: bash
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_ENRICH: javascript,python
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_FILE_METADATA_SELECTION: none
        run: |
          generated="$RUNNER_TEMP/sbom"
          projects=$(git ls-files ':(glob)*/**/package.json' ':(glob)*/**/pyproject.toml' | xargs -n1 dirname | sort -u)
          for project in $projects; do
            mkdir -p "$(dirname "$generated/$project")"
            syft scan "dir:$project" --quiet --select-catalogers javascript,python --output cyclonedx-json \
              | jq 'del(.serialNumber, .metadata.timestamp)' > "$generated/$project.cdx.json"
          done
          rm -rf sbom
          mv "$generated" sbom

      - name: Open a pull request with the SBOMs that changed
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          git add --all sbom
          pr=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq '.[].number')
          if git diff --cached --quiet; then
            echo "develop's SBOMs are up to date."
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "develop's SBOMs are up to date as of $GITHUB_SHA."
            fi
            exit 0
          fi
          if [ -n "$pr" ] && git fetch --quiet origin "$BRANCH" && git diff --cached --quiet FETCH_HEAD -- sbom; then
            echo "Pull request #$pr already has these SBOMs."
            exit 0
          fi
          # The commit is the App's bot user's, with GitHub's noreply address for it.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "Update the SBOMs"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$pr" ]; then
            gh pr create --base develop --head "$BRANCH" --title "Update the SBOMs" \
              --body "The SBOMs in sbom/ after the dependency changes merged into develop as of $GITHUB_SHA, generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          fi
