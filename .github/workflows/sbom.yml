name: SBOM

# Keeps a CycloneDX SBOM of every project in sbom/: one for each directory with a
# package.json or a pyproject.toml, named after it (frontend/ is
# sbom/frontend.cdx.json, backend-api/backend/ is sbom/backend-api/backend.cdx.json).
# A pull request that changes a package.json, a pyproject.toml or a lockfile has
# every SBOM generated again from its branch, and the ones that changed are
# committed to that branch. develop only takes reviewed pull requests, so the
# SBOMs reach it with the change that caused them. sbom/ is written only by this
# workflow: a project that is gone loses its SBOM.
#
# Syft reads the lockfiles. Dev dependencies are included, and licenses a
# lockfile does not record come from the npm registry and PyPI. An SBOM is
# rewritten only when its contents change, not just its serial number and
# timestamp.
on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/bun.lock"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - ".github/workflows/sbom.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SYFT_VERSION: 1.54.1
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47

jobs:
  sbom:
    name: Generate the SBOMs
    # A pull request from a fork gets a read-only token, so its branch cannot be
    # pushed to. The next pull request that runs this brings every SBOM up to date.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Syft
        run: |
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Generate the SBOMs
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_ENRICH: javascript,python
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
          SYFT_FILE_METADATA_SELECTION: none
          SYFT_FORMAT_PRETTY: "true"
        run: |
          generated="$RUNNER_TEMP/sbom"
          projects=$(git ls-files ':(glob)*/**/package.json' ':(glob)*/**/pyproject.toml' | xargs -n1 dirname | sort -u)
          for project in $projects; do
            sbom="$project.cdx.json"
            mkdir -p "$(dirname "$generated/$sbom")"
            syft scan "dir:$project" --quiet --select-catalogers javascript,python \
              --output "cyclonedx-json=$generated/$sbom"
            if [ -f "sbom/$sbom" ] && cmp -s \
              <(jq 'del(.serialNumber, .metadata.timestamp)' "sbom/$sbom") \
              <(jq 'del(.serialNumber, .metadata.timestamp)' "$generated/$sbom"); then
              cp "sbom/$sbom" "$generated/$sbom"
            fi
          done
          rm -rf sbom
          mv "$generated" sbom

      - name: Commit the SBOMs that changed
        run: |
          git add --all sbom
          if git diff --cached --quiet; then
            echo "The SBOMs are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the SBOMs"
          git push origin "HEAD:$GITHUB_HEAD_REF"
