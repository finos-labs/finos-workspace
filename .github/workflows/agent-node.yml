name: Agent Node

on:
  workflow_call:
    outputs:
      key:
        description: The cache key of the stage `node`, saved from the directory agent-node.
        value: ${{ jobs.node.outputs.key }}

permissions:
  contents: read

jobs:
  node:
    name: Node for the agent's images
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: agent-node-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7

      - name: Key the stage by what it is made of
        id: key
        run: |
          stage=$(sed -n '/ AS node-build$/,/^FROM scratch AS node$/p' agent/Dockerfile | sha256sum | cut -c1-16)
          echo "key=agent-node-$RUNNER_OS-$RUNNER_ARCH-$stage" >> "$GITHUB_OUTPUT"

      - name: Look for the stage in the cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: agent-node
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Build the stage
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build --target node --output type=local,dest=agent-node agent

      - name: Keep the stage in the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: agent-node
          key: ${{ steps.key.outputs.key }}
