name: Deploy to dev

# A push to develop builds the changed app and pushes the image to ECR as
# dev-<commit>. Then .github/scripts/pin-dev-tags.sh sets that tag in
# FINOS/dev/apps/values.yaml in workspace-infra and pushes it to main, where the
# Apps workflow deploys it to finos-dev. The job waits for that deploy. If it
# fails, helm has already put the previous release back, and the script sets
# the tag in values.yaml back too, so the file always matches the cluster.
#
# Pushing to workspace-infra uses a GitHub App installed on that repository
# with contents write and actions read: INFRA_APP_ID (variable) and
# INFRA_APP_PRIVATE_KEY (secret).
on:
  push:
    branches:
      - develop
    paths:
      - "backend-api/backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-dev.yml"
      - ".github/scripts/pin-dev-tags.sh"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 149911392452.dkr.ecr.us-east-1.amazonaws.com
  INFRA_REPO: openbq-org/workspace-infra
  VALUES_FILE: FINOS/dev/apps/values.yaml

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend-api/backend/**"
              - ".github/workflows/deploy-dev.yml"
              - ".github/scripts/pin-dev-tags.sh"
            frontend:
              - "frontend/**"
              - ".github/workflows/deploy-dev.yml"
              - ".github/scripts/pin-dev-tags.sh"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-backend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a rerun keeps the images the first attempt pushed.
      - name: Build and push the API and worker images
        run: |
          for image in backend:fastapi.Dockerfile backend-worker:rqworker.Dockerfile; do
            repository="finos/${image%%:*}" dockerfile="${image#*:}"
            if output=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" 2>&1); then
              echo "$repository:$IMAGE_TAG is already in ECR."
            elif grep -q ImageNotFoundException <<< "$output"; then
              docker build -f "backend-api/backend/$dockerfile" -t "$ECR_REGISTRY/$repository:$IMAGE_TAG" backend-api/backend
              docker push "$ECR_REGISTRY/$repository:$IMAGE_TAG"
            else
              echo "$output" >&2
              exit 1
            fi
          done

      - name: Get a token for workspace-infra
        id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: openbq-org
          repositories: workspace-infra
          permission-contents: write
          permission-actions: read

      - name: Pin the tag in workspace-infra and wait for the deploy
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: >-
          .github/scripts/pin-dev-tags.sh
          --repo "$INFRA_REPO"
          --values "$VALUES_FILE"
          --keys backend,backendWorker
          --tag "$IMAGE_TAG"
          --source "$GITHUB_REPOSITORY@$GITHUB_SHA"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-frontend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a rerun keeps the image the first attempt pushed.
      - name: Build and push the frontend image
        run: |
          if output=$(aws ecr describe-images --repository-name finos/frontend --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "finos/frontend:$IMAGE_TAG is already in ECR."
          elif grep -q ImageNotFoundException <<< "$output"; then
            docker build -t "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG" frontend
            docker push "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Get a token for workspace-infra
        id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: openbq-org
          repositories: workspace-infra
          permission-contents: write
          permission-actions: read

      - name: Pin the tag in workspace-infra and wait for the deploy
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: >-
          .github/scripts/pin-dev-tags.sh
          --repo "$INFRA_REPO"
          --values "$VALUES_FILE"
          --keys frontend
          --tag "$IMAGE_TAG"
          --source "$GITHUB_REPOSITORY@$GITHUB_SHA"
