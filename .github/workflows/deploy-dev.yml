name: Deploy to dev

# A push to develop builds the changed images and pushes them to ECR as
# dev-<commit>. Then .github/scripts/request-dev-deploy.sh asks the
# infrastructure repository's Apps workflow to deploy the dev cluster, and waits
# for the result. The message holds what the deploy needs from this repository:
# deploy/dev.yaml (the app settings) and the newest backend and frontend images
# on develop. Nothing is written to the infrastructure repository. A push that
# changes only deploy/dev.yaml deploys the settings without a build, and the
# workflow can also be run by hand to deploy the latest state again. If the
# deploy fails, helm has already put the previous release back.
# .github/scripts/check-deploy-config.sh checks deploy/dev.yaml against the code
# first, and a problem stops the deploy.
#
# Repository variables: AWS_REGION, AWS_IMAGE_PUSH_ROLE_ARN (the role that may
# push to ECR), ECR_REGISTRY (<account>.dkr.ecr.<region>.amazonaws.com),
# INFRA_REPO (<owner>/<infrastructure repository>), DEV_VALUES_FILE (the dev
# environment's values file in that repository, which names its folder) and
# INFRA_APP_ID.
#
# The message is sent with a GitHub App installed on the infrastructure
# repository: INFRA_APP_ID (variable) and INFRA_APP_PRIVATE_KEY (secret).
on:
  push:
    branches:
      - develop
    paths:
      - "backend-api/backend/**"
      - "frontend/**"
      - "deploy/dev.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  INFRA_REPO: ${{ vars.INFRA_REPO }}
  VALUES_FILE: ${{ vars.DEV_VALUES_FILE }}
  SETTINGS_FILE: deploy/dev.yaml

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the app settings
        run: .github/scripts/check-deploy-config.sh "$SETTINGS_FILE"

      # A manual run builds nothing and deploys the latest state.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            backend:
              - "backend-api/backend/**"
            frontend:
              - "frontend/**"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-backend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so a rerun keeps the images the first attempt pushed.
      - name: Build and push the API and worker images
        run: |
          for image in backend:fastapi.Dockerfile backend-worker:rqworker.Dockerfile; do
            repository="finos/${image%%:*}" dockerfile="${image#*:}"
            if output=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" 2>&1); then
              echo "$repository:$IMAGE_TAG is already in ECR."
            elif grep -q ImageNotFoundException <<< "$output"; then
              docker build -f "backend-api/backend/$dockerfile" -t "$ECR_REGISTRY/$repository:$IMAGE_TAG" backend-api/backend
              docker push "$ECR_REGISTRY/$repository:$IMAGE_TAG"
            else
              echo "$output" >&2
              exit 1
            fi
          done

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-frontend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so a rerun keeps the image the first attempt pushed.
      - name: Build and push the frontend image
        run: |
          if output=$(aws ecr describe-images --repository-name finos/frontend --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "finos/frontend:$IMAGE_TAG is already in ECR."
          elif grep -q ImageNotFoundException <<< "$output"; then
            docker build -t "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG" frontend
            docker push "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG"
          else
            echo "$output" >&2
            exit 1
          fi

  deploy:
    needs: [changes, backend, frontend]
    # Runs when nothing failed, whether or not an image was built: a push that
    # changes only deploy/dev.yaml, or a manual run, deploys the latest state.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.backend.result != 'failure' && needs.frontend.result != 'failure' }}
    runs-on: ubuntu-latest
    # A newer deploy replaces one that is still waiting. Its message describes
    # the newest state, so nothing is lost.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    steps:
      # The full history, to find the newest commit that has an image.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Check the app settings
        run: .github/scripts/check-deploy-config.sh "$SETTINGS_FILE"

      - name: Log in to AWS to read the images
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The environment is the folder of its values file: FINOS/dev.
      - name: Name the infrastructure repository and the environment
        id: infra
        run: |
          if [[ $VALUES_FILE != */apps/values.yaml ]]; then
            echo "::error::DEV_VALUES_FILE must end with /apps/values.yaml: $VALUES_FILE"
            exit 1
          fi
          {
            echo "owner=${INFRA_REPO%%/*}"
            echo "name=${INFRA_REPO#*/}"
            echo "environment=${VALUES_FILE%/apps/values.yaml}"
          } >> "$GITHUB_OUTPUT"

      - name: Get a token for the infrastructure repository
        id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: ${{ steps.infra.outputs.owner }}
          repositories: ${{ steps.infra.outputs.name }}
          permission-contents: write
          permission-actions: read

      - name: Ask the infrastructure repository to deploy and wait for the result
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: >-
          .github/scripts/request-dev-deploy.sh
          --repo "$INFRA_REPO"
          --environment "${{ steps.infra.outputs.environment }}"
          --backend-repository finos/backend
          --frontend-repository finos/frontend
          --settings "$SETTINGS_FILE"
