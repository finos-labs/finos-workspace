name: Deploy to dev

# A push to develop that changes the backend or the frontend builds the changed
# images, pushes them to ECR as dev-<commit>, and deploys the dev environment with
# the newest image of each: the latest commit on develop whose image is in ECR,
# so the order in which builds finish does not matter. The deploy runs the
# infrastructure repository's .github/scripts/deploy-workspace.sh with its chart
# and the environment's values file: only the image tags come from here. The
# run's summary lists what is running. Run the workflow by hand, from develop, to
# build whatever develop's latest commit is missing and deploy again.
#
# Repository variables: AWS_REGION, AWS_IMAGE_PUSH_ROLE_ARN (the role that may
# push to ECR), ECR_REGISTRY (<account>.dkr.ecr.<region>.amazonaws.com),
# INFRA_REPO (<owner>/<infrastructure repository>), DEV_VALUES_FILE (the dev
# environment's values file in that repository, which names its folder) and
# INFRA_APP_ID.
#
# The infrastructure repository is read with a GitHub App installed on it:
# INFRA_APP_ID (variable) and INFRA_APP_PRIVATE_KEY (secret). The deploy assumes
# the environment's deployer role, which trusts this repository's develop branch.
on:
  push:
    branches:
      - develop
    paths:
      - "backend-api/backend/**"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  INFRA_REPO: ${{ vars.INFRA_REPO }}
  VALUES_FILE: ${{ vars.DEV_VALUES_FILE }}

jobs:
  changes:
    runs-on: ubuntu-latest
    # A manual run builds both, and an image that is already in ECR is skipped.
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            backend:
              - "backend-api/backend/**"
            frontend:
              - "frontend/**"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-backend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a rerun keeps the images the first attempt pushed.
      - name: Build and push the API and worker images
        run: |
          for image in backend:fastapi.Dockerfile backend-worker:rqworker.Dockerfile; do
            repository="finos/${image%%:*}" dockerfile="${image#*:}"
            if output=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$IMAGE_TAG" 2>&1); then
              echo "$repository:$IMAGE_TAG is already in ECR."
            elif grep -q ImageNotFoundException <<< "$output"; then
              docker build -f "backend-api/backend/$dockerfile" -t "$ECR_REGISTRY/$repository:$IMAGE_TAG" backend-api/backend
              docker push "$ECR_REGISTRY/$repository:$IMAGE_TAG"
            else
              echo "$output" >&2
              exit 1
            fi
          done

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-dev-frontend
      cancel-in-progress: false
    env:
      IMAGE_TAG: dev-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to AWS to push images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable, so a rerun keeps the image the first attempt pushed.
      - name: Build and push the frontend image
        run: |
          if output=$(aws ecr describe-images --repository-name finos/frontend --image-ids imageTag="$IMAGE_TAG" 2>&1); then
            echo "finos/frontend:$IMAGE_TAG is already in ECR."
          elif grep -q ImageNotFoundException <<< "$output"; then
            docker build -t "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG" frontend
            docker push "$ECR_REGISTRY/finos/frontend:$IMAGE_TAG"
          else
            echo "$output" >&2
            exit 1
          fi

  deploy:
    needs: [changes, backend, frontend]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.backend.result != 'failure' && needs.frontend.result != 'failure' }}
    runs-on: ubuntu-latest
    # A newer deploy replaces one that is still waiting. It deploys the newest
    # images, so nothing is lost.
    concurrency:
      group: deploy-dev
      cancel-in-progress: true
    steps:
      # The full history, to find the newest commit that has an image.
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Log in to AWS to read the images
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the newest images on develop
        id: images
        run: .github/scripts/newest-images.sh --backend-repository finos/backend --frontend-repository finos/frontend >> "$GITHUB_OUTPUT"

      # The environment is the folder of its values file: FINOS/dev.
      - name: Name the infrastructure repository and the environment
        id: infra
        run: |
          if [[ $VALUES_FILE != */apps/values.yaml ]]; then
            echo "::error::DEV_VALUES_FILE must end with /apps/values.yaml: $VALUES_FILE"
            exit 1
          fi
          {
            echo "owner=${INFRA_REPO%%/*}"
            echo "name=${INFRA_REPO#*/}"
            echo "environment=${VALUES_FILE%/apps/values.yaml}"
          } >> "$GITHUB_OUTPUT"

      - name: Get a token to read the infrastructure repository
        id: infra-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: ${{ steps.infra.outputs.owner }}
          repositories: ${{ steps.infra.outputs.name }}
          permission-contents: read

      - name: Check out the infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ steps.infra-token.outputs.token }}
          path: infra

      - name: Read the environment
        id: env
        env:
          ENVIRONMENT: ${{ steps.infra.outputs.environment }}
        run: grep -v '^#' "infra/$ENVIRONMENT/apps/deploy.env" >> "$GITHUB_OUTPUT"

      - name: Log in to AWS as the deployer
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.env.outputs.DEPLOYER_ROLE_ARN }}
          aws-region: ${{ steps.env.outputs.AWS_REGION }}
          unset-current-credentials: true

      - uses: azure/setup-helm@v4
        with:
          version: v4.1.1

      - name: Connect to the cluster
        run: aws eks update-kubeconfig --name "${{ steps.env.outputs.CLUSTER_NAME }}" --region "${{ steps.env.outputs.AWS_REGION }}"

      - name: Deploy
        working-directory: infra
        env:
          ENVIRONMENT: ${{ steps.infra.outputs.environment }}
          BACKEND_TAG: ${{ steps.images.outputs.backend }}
          FRONTEND_TAG: ${{ steps.images.outputs.frontend }}
          SOURCE: ${{ github.repository }}@${{ github.sha }}
        run: .github/scripts/deploy-workspace.sh -e "$ENVIRONMENT" -b "$BACKEND_TAG" -f "$FRONTEND_TAG" -s "$SOURCE"
