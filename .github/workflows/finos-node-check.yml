name: finos-node check

# Every week: is the finos-node release the agent's images use (agent-node.yml) still current, and
# does it have a critical CVE? It is current when Node has no newer release of its major version and
# Chimera has the same versions of the packages the release holds (musl, libc++, libc++abi,
# libunwind, OpenSSL, ICU, the time zones), which the SBOM in the image names. A fix there often moves
# only Chimera's package revision, which a vulnerability scan does not see, so this compares versions.
# A run fails, with what changed in its summary, when a release is due: a newer Node is a change to
# agent/Dockerfile and build 1 of it; anything else is the next build of the same Node
# (finos-node-v<version>-<build + 1>, finos-node.yml).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  node:
    uses: ./.github/workflows/agent-node.yml

  check:
    name: Current and without critical CVEs
    needs: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compare the release with what a build would take now
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
        run: |
          docker run --rm "$NODE_IMAGE" /usr/local/bin/node -e \
            'process.stdout.write(require("node:fs").readFileSync("/usr/share/sbom/runtime.cdx.json"))' > released.cdx.json
          packages=$(jq -r '.components[] | select((.purl // "") | startswith("pkg:apk/chimera/")) | .name' released.cdx.json | sort -u | tr '\n' ' ')
          base=$(sed -n 's/^FROM \(chimeralinux\/chimera@sha256:[0-9a-f]*\) AS node-build$/\1/p' agent/Dockerfile)
          docker run --rm "$base" sh -c "apk upgrade --no-cache -q --available > /dev/null && apk add --no-cache -q $packages > /dev/null && apk list -I $packages" > chimera.txt
          curl -fsSL https://nodejs.org/dist/index.json > node-releases.json
          python3 - <<'EOF'
          import json, os, re
          released = {c["name"]: c.get("version") for c in json.load(open("released.cdx.json"))["components"]}
          node = released["node"]
          major = node.split(".")[0]
          latest = next(r["version"].lstrip("v") for r in json.load(open("node-releases.json")) if r["version"].lstrip("v").split(".")[0] == major)
          changes = []
          if latest != node:
              changes.append(f"| Node | {node} | {latest} |")
          for line in open("chimera.txt"):
              package = re.match(r"(\S+)-([^-\s]+-r\d+) \S+ \{", line)
              if not package:
                  continue
              name, version = package.groups()
              if released.get(name) != version:
                  changes.append(f"| {name} | {released.get(name)} | {version} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              if changes:
                  summary.write("A finos-node release is due:\n\n| | Released | Now |\n| --- | --- | --- |\n" + "\n".join(changes) + "\n")
              else:
                  summary.write(f"finos-node with Node {node} is current.\n")
          if changes:
              raise SystemExit("A finos-node release is due: " + ", ".join(c.split("|")[1].strip() for c in changes))
          EOF

      - uses: ./.github/actions/install-syft

      # The SBOM in the image names what has no package database; the scan reads it from Syft's SBOM.
      - name: SBOM of the release
        if: ${{ !cancelled() }}
        env:
          NODE_IMAGE: ${{ needs.node.outputs.image }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: none
        run: syft scan "registry:$NODE_IMAGE" --quiet --select-catalogers +sbom-cataloger --output cyclonedx-json=finos-node.cdx.json

      - name: Scan the release for critical CVEs
        if: ${{ !cancelled() }}
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: finos-node.cdx.json
          severity-cutoff: critical
          output-format: table
