name: Backend checks

on:
  pull_request:
    paths:
      - "backend-api/backend/**"
      - "backend-api/admin_cli/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.22
      - run: ruff check --output-format=github backend admin_cli

  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api/backend
    # MySQL, PostgreSQL and Redis come from testcontainers, which uses the runner's Docker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install poetry==2.3.2
          poetry config virtualenvs.create false
          poetry install --with dev
      - run: pytest tests -q
