name: Backend checks

on:
  pull_request:
    paths:
      - "backend-api/backend/**"
      - "lite/plugin-runner-seccomp.json"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.15.22
      - run: ruff check --output-format=github backend

  tests:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-api/backend
    # MySQL, PostgreSQL and Redis come from testcontainers, which uses the runner's Docker.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install poetry==2.3.2
          poetry config virtualenvs.create false
          poetry install --with dev
      - run: pytest tests -q

  # The plugin runner's sandbox (docs/widget-plugins/SERVER-SIDE.md 5.4, recipe B) on Linux:
  # a probe backend in a container started as the single image is, then the refusal in a
  # container that does not allow the sandbox.
  plugin-runner-sandbox:
    name: Plugin runner sandbox
    runs-on: ubuntu-latest
    env:
      TEST: >-
        pip install -q --root-user-action=ignore pytest==8.4.2 pydantic==2.13.4 httpx==0.28.1
        && python -m pytest -p no:cacheprovider --noconftest -c /dev/null --rootdir /code -v
        tests/test_plugin_runner_sandbox.py
    steps:
      - uses: actions/checkout@v4
      # Ubuntu keeps unconfined processes from using the user namespaces they make, which the
      # sandbox needs (lite/README.md, Plugin backends)
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: In a container that allows the sandbox
        run: >-
          docker run --rm --security-opt seccomp=lite/plugin-runner-seccomp.json
          --security-opt apparmor=unconfined -e PLUGIN_RUNNER_SANDBOX=1
          -v "$PWD/backend-api/backend:/code:ro" -w /code python:3.13-slim sh -c "$TEST"
      - name: In a container that does not
        run: >-
          docker run --rm -e PLUGIN_RUNNER_SANDBOX=refused
          -v "$PWD/backend-api/backend:/code:ro" -w /code python:3.13-slim sh -c "$TEST"
