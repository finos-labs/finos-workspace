name: Image SBOM
description: >
  Attests a CycloneDX SBOM of an image pushed to ECR and pushes the attestation
  to ECR with the image, unless the image has an SBOM attestation already. Syft
  reads the image: its OS packages, the packages installed in it, its runtimes
  and the SBOM files it carries. Needs the image's ECR credentials and the job permissions
  id-token: write and attestations: write. The attestation can be read with
  `gh attestation verify oci://<image> --owner <owner>
  --predicate-type https://cyclonedx.org/bom`.
inputs:
  image:
    description: The pushed image, as <registry>/<repository>:<tag>.
    required: true
  project:
    description: >
      A directory whose package SBOM goes into the image's, generated from the
      lockfile as sbom.yml does it but without the dev dependencies, which no
      image ships. For an image whose packages a scan cannot see: the
      frontend's are bundled into static files that name none.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Find the image's digest and its SBOM attestation
      id: image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        GH_TOKEN: ${{ github.token }}
      run: |
        name="${IMAGE%:*}" tag="${IMAGE##*:}"
        repository="${name#*/}"
        digest=$(aws ecr describe-images --repository-name "$repository" --image-ids imageTag="$tag" \
          --query 'imageDetails[0].imageDigest' --output text)
        sboms=$(gh api "repos/$GITHUB_REPOSITORY/attestations/$digest?predicate_type=sbom" --jq '.attestations | length' 2>/dev/null) || sboms=0
        {
          echo "name=$name"
          echo "digest=$digest"
          echo "attested=$([ "$sboms" -gt 0 ] && echo true || echo false)"
          echo "sbom=$RUNNER_TEMP/image-sbom/${repository//\//-}.cdx.json"
        } >> "$GITHUB_OUTPUT"

    - if: steps.image.outputs.attested != 'true'
      uses: ./.github/actions/install-syft

    - name: Generate the SBOM
      if: steps.image.outputs.attested != 'true'
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        PROJECT: ${{ inputs.project }}
        SBOM: ${{ steps.image.outputs.sbom }}
        SYFT_CHECK_FOR_APP_UPDATE: "false"
        SYFT_FILE_METADATA_SELECTION: none
      run: |
        mkdir -p "$(dirname "$SBOM")"
        docker image inspect "$IMAGE" > /dev/null 2>&1 || docker pull --quiet "$IMAGE"
        syft scan "docker:$IMAGE" --quiet --select-catalogers +sbom-cataloger --output "cyclonedx-json=$SBOM"
        if [ -n "$PROJECT" ]; then
          SYFT_ENRICH=javascript,python SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=false \
            syft scan "dir:$PROJECT" --quiet --select-catalogers javascript,python --output "cyclonedx-json=$SBOM.project"
          jq -s -f "$GITHUB_ACTION_PATH/merge.jq" "$SBOM" "$SBOM.project" > "$SBOM.merged"
          mv "$SBOM.merged" "$SBOM"
        fi

    - name: Attest the SBOM and push it to ECR
      if: steps.image.outputs.attested != 'true'
      uses: actions/attest@v4
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.image.outputs.digest }}
        sbom-path: ${{ steps.image.outputs.sbom }}
        push-to-registry: true
