services:
  fastapi:
    command:
      - "sh"
      - "-c"
      - "python -m alembic upgrade head && exec python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers ${STRESS_WORKERS:-1}"
    environment:
      WORKERS: "${STRESS_WORKERS:-1}"
      PROMETHEUS: "1"
      RATE_LIMIT_EXEMPT_ENABLED: "1"
      RUNTIME_METRICS_INTERVAL: "0.25"
    ports: !override
      - "${STRESS_HOST_PORT:-8001}:8000"
