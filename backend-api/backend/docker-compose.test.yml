services:
  test_db:
    image: mysql:8.4
    command:
      - --require-secure-transport=OFF
      - --disable-log-bin
      - --innodb-flush-method=nosync
      - --innodb-flush-log-at-trx-commit=0
      - --log-error-verbosity=1
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: test_db
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3307:3306"
    # Pinged over TCP: on a first start the entrypoint runs a temporary server on the socket only,
    # while it creates the database, and a socket ping would call that healthy too early.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-ptest_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  test_postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  test_valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
