server {
  listen ${NGINX_PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(health|healthz)$ {
    access_log off;
    return 200 '{"status": "ok"}';
    add_header Content-Type application/json;
  }

  # Serve every route of the single-page app
  location / {
    try_files $uri $uri/ /index.html;
  }
}
